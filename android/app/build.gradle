plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.ghostbug.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.ghostbug.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
