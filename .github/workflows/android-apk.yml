name: Build Android APK

# Builds a sideloadable debug APK of Ghostbug and uploads it as a downloadable
# artifact. Run it from the GitHub "Actions" tab (Run workflow), or on a push.
on:
  push:
    branches: [ "**" ]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle web game into the app assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html styles.css src android/app/src/main/assets/www/
          echo "Bundled assets:"
          find android/app/src/main/assets/www -maxdepth 2 -type f | sort

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Ghostbug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghostbug-APK
          path: dist/Ghostbug.apk
          if-no-files-found: error

      - name: Attach APK to release (when tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Ghostbug.apk
